<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Processing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
            <h1 class="mb-4">Quantized Image Processing</h1>
            <div class="form-group">
                <label for="fileInput">Upload Image:</label>
                <input type="file" id="fileInput" class="form-control mb-3" accept=".jpg, .jpeg, .png">
                <span class="fst-italic" style="color: chocolate;">Note: Larger the image Resolution. Greater will be the processing time</span>
            </div>
            <div class="form-group mt-3">
                <label for="scaleInput">Scale Factor (2, 4, 8, 16, 32, 64, 128):</label>
                <input type="number" id="scaleInput" class="form-control mb-3" min="2" max="128" value="2">
            </div>
            <div class="col">
                <button type="button" class="btn btn-secondary mr-2" onclick="uploadImage(0)">Low Level (Gray)</button>
                <button type="button" class="btn btn-secondary mr-2" onclick="uploadImage(1)">Mid Level (Gray)</button>
                <button type="button" class="btn btn-secondary mr-2" onclick="uploadImage(2)">High Level (Gray)</button>
                <button type="button" class="btn btn-primary mr-2" onclick="uploadImage(3)">Low Level (RGB)</button>
                <button type="button" class="btn btn-primary mr-2" onclick="uploadImage(4)">Mid Level (RGB)</button>
                <button type="button" class="btn btn-primary mr-2" onclick="uploadImage(5)">High Level (RGB)</button>
            </div>
            <div class="mt-5 d-flex justify-content-center">
                <div id="loadingSpinner" class="spinner-border text-primary" role="status" style="display: none;">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
            <br>
            <div class="mt-3">
                <h2>Processed Image:</h2>
                <img id="processedImage" class="img-fluid">
            </div>
    </div>

    <script>
        async function uploadImage(colorFactor) {
            const loadingSpinner = document.getElementById('loadingSpinner');
            loadingSpinner.style.display = 'block'; // Show loading spinner
            const fileInput = document.getElementById('fileInput');
            const scaleInput = document.getElementById('scaleInput');
            const file = fileInput.files[0];
            console.log(file);
            const scale = parseInt(scaleInput.value);

            if (!file) {
                alert("Please select a file.");
                loadingSpinner.style.display = 'none';
                return;
            } else {
                // checking the file format
                const fileName = file.name;
                const fileExtension = fileName.split('.').pop().toLowerCase();
                // Allowed file formats
                const allowedFormats = ['jpg', 'jpeg', 'png'];

                if (allowedFormats.includes(fileExtension)) {
                    console.log('File format is allowed.');
                } else {
                    // File format is not allowed
                    alert("Invalid file format. Please select a file with .jpg, .jpeg, .png extension.");
                    loadingSpinner.style.display = 'none';
                    return;
                }
            }

            if (scale != 2 && scale != 4 && scale != 8 && scale != 16 && scale != 32 && scale != 64 && scale != 128){
                alert("Scale Factor is invalid. Please enter valid input");
                loadingSpinner.style.display = 'none';
                return; 
            }

            var formData = new FormData();
            formData.append("file", file);
            console.log(formData.get("file"))

            try {
                event.preventDefault();

                const response = await fetch(`http://localhost:8000/processing/${colorFactor}/${scale}/`, {
                        method: 'POST',
                        body: formData,
                    });

                if (response.ok) {
                    const processedImageBlob = await response.blob();
                    const processedImageUrl = URL.createObjectURL(processedImageBlob);
                    const processedImage = document.getElementById('processedImage');
                    processedImage.src = processedImageUrl;
                } else {
                    const errorResponse = await response.json();
                    alert(`Error: ${errorResponse.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                loadingSpinner.style.display = 'none'; // Hide loading spinner after response is received
            }
        }
    </script>
</body>

</html>
